services:
  base:
    image: "tuananh165/ecommerce-base:latest"
    build:
      context: .
      dockerfile: docker/base.dockerfile
    profiles:
      - build-only

  kafka:
    container_name: kafka
    hostname: kafka
    image: docker.io/apache/kafka:4.1.1
    volumes:
      - "kafka-volume:/var/lib/kafka/data"
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped

  account_db:
    container_name: "account_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - account_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  product_db:
    container_name: "product_db"
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:6.2.4
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      discovery.type: single-node
    volumes:
      - product_db_data:/usr/share/elasticsearch/data

  order_db:
    container_name: "order_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  payment_db:
    container_name: "payment_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  inventory_db:
    container_name: "inventory_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  notification_db:
    container_name: "notification_db"
    image: postgres:14.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: "redis"
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  recommender_db:
    container_name: "recommender_db"
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Tuananh165-art}
      POSTGRES_USER: ${POSTGRES_USER:-Tuananh165-art}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - recommender_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  account:
    container_name: "account"
    image: "tuananh165/account:latest"
    build:
      context: .
      dockerfile: docker/services/account.dockerfile
    depends_on:
      - account_db
    environment:
      DATABASE_URL: ${ACCOUNT_DATABASE_URL:-postgres://Tuananh165-art:123456@account_db/Tuananh165-art?sslmode=disable}
      SECRET_KEY: ${SECRET_KEY:-change-me-local-secret}
      ISSUER: ${ISSUER:-goshopx-local}
    restart: on-failure

  product:
    container_name: "product"
    image: "tuananh165/product:latest"
    build:
      context: .
      dockerfile: docker/services/product.dockerfile
    depends_on:
      - product_db
      - kafka
    environment:
      DATABASE_URL: ${PRODUCT_DATABASE_URL:-http://product_db:9200}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    restart: on-failure

  order:
    container_name: "order"
    image: "tuananh165/order:latest"
    build:
      context: .
      dockerfile: docker/services/order.dockerfile
    depends_on:
      - order_db
      - account
      - product
      - kafka
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL:-postgres://Tuananh165-art:123456@order_db/Tuananh165-art?sslmode=disable}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-account:8080}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-product:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ORDER_EVENTS_TOPIC: ${ORDER_EVENTS_TOPIC:-order_events}
    restart: on-failure

  payment:
    container_name: "payment"
    image: "tuananh165/payment:latest"
    build:
      context: .
      dockerfile: docker/services/payment.dockerfile
    depends_on:
      - payment_db
      - order
      - inventory
      - cart
      - kafka
    environment:
      DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgres://Tuananh165-art:123456@payment_db/Tuananh165-art?sslmode=disable}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-order:8080}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-inventory:8080}
      CART_SERVICE_URL: ${CART_SERVICE_URL:-cart:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      PRODUCT_EVENTS_TOPIC: ${PRODUCT_EVENTS_TOPIC:-product_events}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payment_events}
      DODO_API_KEY: ${DODO_API_KEY:-}
      DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET:-}
      DODO_CHECKOUT_URL: ${DODO_CHECKOUT_URL:-}
      DODO_TEST_MODE: ${DODO_TEST_MODE:-false}
    restart: on-failure

  inventory:
    container_name: "inventory"
    image: "tuananh165/inventory:latest"
    build:
      context: .
      dockerfile: docker/services/inventory.dockerfile
    depends_on:
      - inventory_db
      - kafka
    environment:
      DATABASE_URL: ${INVENTORY_DATABASE_URL:-postgres://Tuananh165-art:123456@inventory_db/Tuananh165-art?sslmode=disable}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      INVENTORY_EVENTS_TOPIC: ${INVENTORY_EVENTS_TOPIC:-inventory_events}
    restart: on-failure

  cart:
    container_name: "cart"
    image: "tuananh165/cart:latest"
    build:
      context: .
      dockerfile: docker/services/cart.dockerfile
    depends_on:
      - redis
      - inventory
      - kafka
    environment:
      REDIS_URL: ${REDIS_URL:-redis:6379}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-inventory:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CART_EVENTS_TOPIC: ${CART_EVENTS_TOPIC:-cart_events}
    restart: on-failure

  notification:
    container_name: "notification"
    image: "tuananh165/notification:latest"
    build:
      context: .
      dockerfile: docker/services/notification.dockerfile
    depends_on:
      - notification_db
      - kafka
    environment:
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:-postgres://Tuananh165-art:123456@notification_db/Tuananh165-art?sslmode=disable}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CART_EVENTS_TOPIC: ${CART_EVENTS_TOPIC:-cart_events}
      INVENTORY_EVENTS_TOPIC: ${INVENTORY_EVENTS_TOPIC:-inventory_events}
      ORDER_EVENTS_TOPIC: ${ORDER_EVENTS_TOPIC:-order_events}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC:-payment_events}
    restart: on-failure

  recommender-server:
    container_name: "recommender"
    image: "tuananh165/recommender:latest"
    build:
      context: .
      dockerfile: docker/services/recommender.dockerfile
    command: python main.py server
    depends_on:
      - recommender_db
      - kafka
    environment:
      DATABASE_URL: ${RECOMMENDER_DATABASE_URL:-postgresql://Tuananh165-art:123456@recommender_db/Tuananh165-art?sslmode=disable}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ARTIFACTS_LOCAL_PATH: ${ARTIFACTS_LOCAL_PATH:-/app/artifacts}
      GRPC_PORT: 8080
    volumes:
      - recommender_artifacts:/app/artifacts
    restart: on-failure

  recommender-sync:
    container_name: "recommender-sync"
    image: "tuananh165/recommender-sync:latest"
    build:
      context: .
      dockerfile: docker/services/recommender.dockerfile
    command: python main.py consumer
    depends_on:
      - recommender_db
      - kafka
    environment:
      DATABASE_URL: ${RECOMMENDER_DATABASE_URL:-postgresql://Tuananh165-art:123456@recommender_db/Tuananh165-art?sslmode=disable}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      PRODUCT_API: http://product:8080/products
      PRODUCT_EVENTS_TOPIC: ${PRODUCT_EVENTS_TOPIC:-product_events}
      INTERACTION_EVENTS_TOPIC: ${INTERACTION_EVENTS_TOPIC:-interaction_events}
    restart: on-failure

  recommender-train:
    container_name: "recommender-train"
    image: "tuananh165/recommender-train:latest"
    build:
      context: .
      dockerfile: docker/services/recommender.dockerfile
    command: sh -c "while true; do python main.py train; sleep 43200; done"
    depends_on:
      - recommender_db
    environment:
      DATABASE_URL: ${RECOMMENDER_DATABASE_URL:-postgresql://Tuananh165-art:123456@recommender_db/Tuananh165-art?sslmode=disable}
      ARTIFACTS_LOCAL_PATH: ${ARTIFACTS_LOCAL_PATH:-/app/artifacts}
    volumes:
      - recommender_artifacts:/app/artifacts
    restart: on-failure

  graphql:
    container_name: "graphql"
    image: "tuananh165/graphql:latest"
    build:
      context: .
      dockerfile: docker/services/graphql.dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - account
      - product
      - order
      - payment
      - inventory
      - cart
      - notification
      - recommender-server
      - recommender-sync
    environment:
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-account:8080}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-product:8080}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-order:8080}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-payment:8080}
      RECOMMENDER_SERVICE_URL: ${RECOMMENDER_SERVICE_URL:-recommender:8080}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-inventory:8080}
      CART_SERVICE_URL: ${CART_SERVICE_URL:-cart:8080}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-notification:8080}
      SECRET_KEY: ${SECRET_KEY:-change-me-local-secret}
      ISSUER: ${ISSUER:-goshopx-local}
    restart: on-failure

volumes:
  account_db_data:
  product_db_data:
  order_db_data:
  payment_db_data:
  inventory_db_data:
  notification_db_data:
  recommender_db_data:
  recommender_artifacts:
  kafka-volume:
  redis_data:
