global:
  imageRegistry: ghcr.io/replace-owner
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  runtimeSecretName: goshopx-runtime
  ingress:
    enabled: false
    className: traefik
    host: ""
    tlsSecretName: ""
  kong:
    image: kong:3.9
    proxyNodePort:
      enabled: false
      port: 30080
    managementNodePorts:
      enabled: false
      admin: 30081
      manager: 30082
    managerURL: ""
    managerAPIURL: ""
    resources: { requests: { cpu: 75m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
  graphqlNodePort:
    enabled: false
    port: 30712
  networkPolicy:
    enabled: false

observability:
  metricsPort: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
  tracing:
    # Empty keeps tracing disabled. The lab overlay sends OTLP/gRPC to Jaeger.
    otlpEndpoint: ""

infrastructure:
  enabled: false
  security:
    # The official PostgreSQL image stores its data as uid/gid 999.  Keep the
    # values configurable for a compatible image upgrade, rather than relying
    # on the image entrypoint to start as root and change ownership at runtime.
    postgres:
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
  dashboards:
    nodePort: false
    kibana: 30601
    kafkaUI: 30602
    # Kafka UI is an optional operator dashboard. Kafka itself remains enabled
    # for application events even if the dashboard is later disabled.
    kafkaUIEnabled: true
    minioConsole: 30603
    redisInsight: 30604
  # These ports expose non-HTTP protocols for controlled operator access.
  # Keep disabled unless the VM firewall is restricted to trusted source IPs.
  nodePorts:
    enabled: false
    redis: 30704
    kafka: 30705
    milvus: 30706
    attuUI: 30707
    jaegerUI: 30713
  storageClass: local-path

image:
  tag: latest

# Each image is expected at $global.imageRegistry/goshopx-<name>:$image.tag.
# Only GraphQL is public; all other ports are internal gRPC endpoints.
services:
  graphql:
    enabled: true
    metricsEnabled: true
    port: 8080
    public: true
    secretKeys: { SECRET_KEY: SECRET_KEY, MINIO_ACCESS_KEY: MINIO_ACCESS_KEY, MINIO_SECRET_KEY: MINIO_SECRET_KEY }
    resources: { requests: { cpu: 75m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
  account:
    enabled: true
    metricsEnabled: true
    port: 8080
    secretKeys: { DATABASE_URL: ACCOUNT_DATABASE_URL, SECRET_KEY: SECRET_KEY, GOOGLE_CLIENT_ID: GOOGLE_CLIENT_ID }
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  product:
    enabled: true
    metricsEnabled: true
    port: 8080
    extraPorts: [{ name: sync-http, port: 8081 }]
    secretKeys: { DATABASE_URL: PRODUCT_DATABASE_URL }
    resources: { requests: { cpu: 75m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
  order:
    enabled: true
    metricsEnabled: true
    port: 8080
    secretKeys: { DATABASE_URL: ORDER_DATABASE_URL }
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  payment:
    enabled: true
    metricsEnabled: true
    port: 8080
    extraPorts: [{ name: webhook, port: 8081 }]
    secretKeys: { DATABASE_URL: PAYMENT_DATABASE_URL, VNPAY_TMN_CODE: VNPAY_TMN_CODE, VNPAY_HASH_SECRET: VNPAY_HASH_SECRET, VNPAY_PAYMENT_URL: VNPAY_PAYMENT_URL }
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  inventory:
    enabled: true
    metricsEnabled: true
    port: 8080
    secretKeys: { DATABASE_URL: INVENTORY_DATABASE_URL }
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  cart:
    enabled: true
    metricsEnabled: true
    port: 8080
    secretKeys: {}
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  notification:
    enabled: true
    metricsEnabled: true
    port: 8080
    secretKeys: { DATABASE_URL: NOTIFICATION_DATABASE_URL, GMAIL_USERNAME: GMAIL_USERNAME, GMAIL_PASSWORD: GMAIL_PASSWORD, GMAIL_FROM: GMAIL_FROM }
    resources: { requests: { cpu: 30m, memory: 48Mi }, limits: { cpu: 200m, memory: 128Mi } }
  admin:
    enabled: false
    metricsEnabled: true
    port: 8080
    secretKeys: { DATABASE_URL: ADMIN_DATABASE_URL }
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
  recommender-server:
    enabled: false
    port: 8080
    command: [python, main.py, server]
    secretKeys: { DATABASE_URL: RECOMMENDER_DATABASE_URL, AI_API_KEY: AI_API_KEY }
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 750m, memory: 768Mi } }
  recommender-sync:
    enabled: false
    port: 8080
    command: [python, main.py, consumer]
    secretKeys: { DATABASE_URL: RECOMMENDER_DATABASE_URL, AI_API_KEY: AI_API_KEY }
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
  recommender-train:
    enabled: false
    port: 8080
    command: [sh, -c, "while true; do python main.py train; sleep 43200; done"]
    secretKeys: { DATABASE_URL: RECOMMENDER_DATABASE_URL }
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: 500m, memory: 512Mi } }
  web:
    enabled: true
    port: 8080
    secretKeys: {}
    resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 150m, memory: 96Mi } }

# Put non-secret endpoints and feature flags here. Sensitive values must be
# added to the existing runtime Secret, never committed to values files.
config:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ACCOUNT_SERVICE_URL: account:8080
  PRODUCT_SERVICE_URL: product:8080
  ORDER_SERVICE_URL: order:8080
  PAYMENT_SERVICE_URL: payment:8080
  INVENTORY_SERVICE_URL: inventory:8080
  CART_SERVICE_URL: cart:8080
  NOTIFICATION_SERVICE_URL: notification:8080
  ADMIN_SERVICE_URL: admin:8080
  RECOMMENDER_SERVICE_URL: recommender-server:8080
  REDIS_URL: redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_BUCKET: product-media
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_URL: ""
  DUMMYJSON_SEED_ENABLED: "false"
  PRODUCT_EVENTS_TOPIC: product_events
  INTERACTION_EVENTS_TOPIC: interaction_events
  ORDER_EVENTS_TOPIC: order_events
  PAYMENT_EVENTS_TOPIC: payment_events
  INVENTORY_EVENTS_TOPIC: inventory_events
  CART_EVENTS_TOPIC: cart_events
  ADMIN_EVENTS_TOPIC: admin_events
  ACCOUNT_EVENTS_TOPIC: account_events
