apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
data:
  kong.yaml: |
    _format_version: "3.0"
    _transform: true
    upstreams:
      - name: graphql-upstream
        targets: [{ target: graphql.{{ .Release.Namespace }}.svc.cluster.local:8080, weight: 100 }]
        healthchecks:
          active: { type: http, http_path: /health, healthy: { interval: 5, successes: 2 }, unhealthy: { interval: 5, http_failures: 2, timeouts: 2 } }
      - name: payment-webhook-upstream
        targets: [{ target: payment.{{ .Release.Namespace }}.svc.cluster.local:8081, weight: 100 }]
      - name: web-upstream
        targets: [{ target: web.{{ .Release.Namespace }}.svc.cluster.local:8080, weight: 100 }]
    services:
      - name: web-storefront
        protocol: http
        host: web-upstream
        port: 80
        routes: [{ name: web-storefront, paths: [/], methods: [GET], strip_path: false }]
      - name: graphql-public-api
        protocol: http
        host: graphql-upstream
        port: 80
        routes:
          - name: graphql
            paths: [/graphql]
            methods: [POST]
            strip_path: false
            plugins:
              - name: rate-limiting
                config: { minute: 300, policy: local, limit_by: ip, fault_tolerant: false }
              - name: correlation-id
                config: { header_name: X-Request-ID, generator: uuid, echo_downstream: true }
          - name: graphql-browser-tools
            paths: [/playground, /health]
            methods: [GET]
            strip_path: false
      - name: payment-provider-webhook
        protocol: http
        host: payment-webhook-upstream
        port: 80
        routes: [{ name: vnpay-payment-ipn, paths: [/webhook/payment], methods: [GET], strip_path: false }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels: { app.kubernetes.io/name: goshopx, app.kubernetes.io/component: kong }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: kong } }
  template:
    metadata: { labels: { app.kubernetes.io/name: goshopx, app.kubernetes.io/component: kong } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
        fsGroup: 1337
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kong
          image: {{ .Values.global.kong.image | quote }}
          ports:
            - { name: proxy, containerPort: 8000 }
            - { name: admin, containerPort: 8001 }
            - { name: manager, containerPort: 8002 }
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/kong.yaml }
            - { name: KONG_PREFIX, value: /var/run/kong }
            - { name: KONG_PROXY_ACCESS_LOG, value: /dev/stdout }
            - { name: KONG_PROXY_ERROR_LOG, value: /dev/stderr }
            - { name: KONG_ADMIN_ACCESS_LOG, value: /dev/stdout }
            - { name: KONG_ADMIN_ERROR_LOG, value: /dev/stderr }
            - { name: KONG_PROXY_LISTEN, value: 0.0.0.0:8000 }
            - { name: KONG_ADMIN_LISTEN, value: 0.0.0.0:8001 }
            - { name: KONG_ADMIN_GUI_LISTEN, value: 0.0.0.0:8002 }
            - { name: KONG_ADMIN_GUI_URL, value: {{ default "http://localhost:8002" .Values.global.kong.managerURL | quote }} }
            - { name: KONG_ADMIN_GUI_API_URL, value: {{ default "http://localhost:8001" .Values.global.kong.managerAPIURL | quote }} }
            - { name: KONG_NGINX_WORKER_PROCESSES, value: {{ default "auto" .Values.global.kong.nginxWorkerProcesses | quote }} }
            - { name: KONG_MEM_CACHE_SIZE, value: {{ default "128m" .Values.global.kong.memCacheSize | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - { name: config, mountPath: /kong, readOnly: true }
            - { name: kong-tmp, mountPath: /tmp }
            - { name: kong-prefix, mountPath: /var/run/kong }
          resources: {{- toYaml .Values.global.kong.resources | nindent 12 }}
          livenessProbe: { tcpSocket: { port: proxy }, initialDelaySeconds: 15, periodSeconds: 15 }
          readinessProbe: { tcpSocket: { port: proxy }, initialDelaySeconds: 5, periodSeconds: 10 }
      volumes:
        - { name: config, configMap: { name: kong-declarative-config } }
        - { name: kong-tmp, emptyDir: {} }
        - { name: kong-prefix, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: kong-proxy }
spec:
  type: {{ if .Values.global.kong.proxyNodePort.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app.kubernetes.io/component: kong }
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
      {{- if .Values.global.kong.proxyNodePort.enabled }}
      nodePort: {{ .Values.global.kong.proxyNodePort.port }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: kong-admin }
spec:
  type: {{ if .Values.global.kong.managementNodePorts.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app.kubernetes.io/component: kong }
  ports:
    - name: admin
      port: 8001
      targetPort: admin
      {{- if .Values.global.kong.managementNodePorts.enabled }}
      nodePort: {{ .Values.global.kong.managementNodePorts.admin }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: kong-manager }
spec:
  type: {{ if .Values.global.kong.managementNodePorts.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app.kubernetes.io/component: kong }
  ports:
    - name: manager
      port: 8002
      targetPort: manager
      {{- if .Values.global.kong.managementNodePorts.enabled }}
      nodePort: {{ .Values.global.kong.managementNodePorts.manager }}
      {{- end }}
