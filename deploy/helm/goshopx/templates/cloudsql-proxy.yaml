{{- if and .Values.infrastructure.enabled .Values.infrastructure.cloudSQL.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.infrastructure.cloudSQL.serviceAccountName }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "infrastructure.cloudSQL.gcpServiceAccountEmail required" .Values.infrastructure.cloudSQL.gcpServiceAccountEmail | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsql-proxy
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudsql-proxy }
  template:
    metadata:
      labels: { app: cloudsql-proxy }
    spec:
      serviceAccountName: {{ .Values.infrastructure.cloudSQL.serviceAccountName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloud-sql-proxy
          image: {{ .Values.infrastructure.cloudSQL.image }}
          args:
            - "--private-ip"
            - "--address=0.0.0.0"
            - "--port=5432"
            - {{ required "infrastructure.cloudSQL.instanceConnectionName required" .Values.infrastructure.cloudSQL.instanceConnectionName | quote }}
          ports: [{ name: postgres, containerPort: 5432 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.infrastructure.cloudSQL.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsql-proxy
spec:
  selector: { app: cloudsql-proxy }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
{{- end }}
