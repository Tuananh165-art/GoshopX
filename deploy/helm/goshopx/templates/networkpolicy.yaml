{{- if .Values.global.networkPolicy.enabled }}
# Requires a NetworkPolicy-enforcing CNI such as Cilium or Calico. K3s Flannel
# alone does not enforce this object; see the runbook before enabling it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goshopx-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goshopx-graphql-public-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: graphql
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
