{{- if .Values.infrastructure.enabled }}
{{- /* The single-node lab deliberately uses one replica per dependency. */}}
{{- $dashType := ternary "NodePort" "ClusterIP" .Values.infrastructure.dashboards.nodePort }}
{{- $operatorNodePorts := .Values.infrastructure.nodePorts }}
{{- range $name := list "account-db" "order-db" "payment-db" "inventory-db" "notification-db" "admin-db" "recommender-db" }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  type: ClusterIP
  selector: { app: {{ $name }} }
  ports: [{ name: postgresql, port: 5432, targetPort: postgresql }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ $name }} }
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata: { labels: { app: {{ $name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $.Values.infrastructure.security.postgres.runAsUser }}
        runAsGroup: {{ $.Values.infrastructure.security.postgres.runAsGroup }}
        fsGroup: {{ $.Values.infrastructure.security.postgres.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        # PostgreSQL needs a runtime directory for its Unix socket and lock
        # files.  Keeping it on an emptyDir allows the image filesystem to be
        # mounted read-only while the database data remains on its PVC.
        - name: runtime
          emptyDir: {}
      containers:
        - name: postgresql
          image: {{ if eq $name "recommender-db" }}postgres:15{{ else }}postgres:14.0{{ end }}
          ports: [{ name: postgresql, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: goshopx }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: {{ $.Values.global.runtimeSecretName }}, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.global.runtimeSecretName }}, key: POSTGRES_PASSWORD } } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: runtime, mountPath: /var/run/postgresql }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 384Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $.Values.infrastructure.storageClass }}
        resources: { requests: { storage: 2Gi } }
{{- end }}
{{- range $name, $component := dict
  "redis" (dict "image" "redis:7.4-alpine" "port" 6379 "command" (list "redis-server" "--appendonly" "yes"))
  "kafka" (dict "image" "docker.io/apache/kafka:4.1.1" "port" 9092 "extraPorts" (list (dict "name" "controller" "port" 9093)) "env" (dict "KAFKA_NODE_ID" "1" "KAFKA_PROCESS_ROLES" "broker,controller" "KAFKA_LISTENERS" "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" "KAFKA_ADVERTISED_LISTENERS" "PLAINTEXT://kafka:9092" "KAFKA_CONTROLLER_LISTENER_NAMES" "CONTROLLER" "KAFKA_CONTROLLER_QUORUM_VOTERS" "1@kafka:9093" "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP" "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR" "1"))
  "product-db" (dict "image" "docker.elastic.co/elasticsearch/elasticsearch-oss:6.2.4" "port" 9200 "env" (dict "discovery.type" "single-node" "ES_JAVA_OPTS" "-Xms256m -Xmx256m" "path.data" "/usr/share/elasticsearch/data") "resources" $.Values.infrastructure.productDatabase.resources "persistence" (dict "mountPath" "/usr/share/elasticsearch/data" "size" $.Values.infrastructure.productDatabase.persistence.size))
  "minio" (dict "image" "minio/minio:RELEASE.2025-04-22T22-12-26Z" "port" 9000 "command" (list "minio" "server" "/data" "--console-address" ":9001"))
  "milvus-etcd" (dict "image" "quay.io/coreos/etcd:v3.5.18" "port" 2379 "command" (list "etcd" "--advertise-client-urls=http://milvus-etcd:2379" "--listen-client-urls=http://0.0.0.0:2379" "--data-dir" "/etcd"))
  "milvus-minio" (dict "image" "minio/minio:RELEASE.2025-04-22T22-12-26Z" "port" 9000 "command" (list "minio" "server" "/minio_data"))
  "milvus" (dict "image" "milvusdb/milvus:v2.5.10" "port" 19530 "command" (list "/milvus/bin/milvus" "run" "standalone") "env" (dict "ETCD_ENDPOINTS" "milvus-etcd:2379" "MINIO_ADDRESS" "milvus-minio:9000"))
 }}
{{- with $persistence := $component.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ $name }}-data }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.infrastructure.storageClass }}
  resources: { requests: { storage: {{ $persistence.size }} } }
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }} }
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata: { labels: { app: {{ $name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $name "redis" }}999{{ else }}1000{{ end }}
        runAsGroup: {{ if eq $name "redis" }}999{{ else }}1000{{ end }}
        fsGroup: {{ if eq $name "redis" }}999{{ else }}1000{{ end }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
        {{- if eq $name "redis" }}
        - name: redis-data
          emptyDir: {}
        {{- end }}
        {{- if eq $name "kafka" }}
        # Apache Kafka generates effective configuration and writes segment
        # data at startup. Both locations must remain writable with a
        # read-only root filesystem.
        - name: kafka-config
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
        {{- end }}
        {{- if eq $name "minio" }}
        - name: minio-data
          emptyDir: {}
        {{- end }}
        {{- if eq $name "milvus-etcd" }}
        - name: etcd-data
          emptyDir: {}
        {{- end }}
        {{- if eq $name "milvus-minio" }}
        - name: milvus-minio-data
          emptyDir: {}
        {{- end }}
        {{- if eq $name "milvus" }}
        - name: milvus-data
          emptyDir: {}
        {{- end }}
        {{- with $component.persistence }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $component.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            {{- if eq $name "redis" }}
            - name: redis-data
              mountPath: /data
            {{- end }}
            {{- if eq $name "kafka" }}
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: kafka-logs
              mountPath: /tmp/kafka-logs
            {{- end }}
            {{- if eq $name "minio" }}
            - name: minio-data
              mountPath: /data
            {{- end }}
            {{- if eq $name "milvus-etcd" }}
            - name: etcd-data
              mountPath: /etcd
            {{- end }}
            {{- if eq $name "milvus-minio" }}
            - name: milvus-minio-data
              mountPath: /minio_data
            {{- end }}
            {{- if eq $name "milvus" }}
            - name: milvus-data
              mountPath: /var/lib/milvus
            {{- end }}
            {{- with $component.persistence }}
            - name: data
              mountPath: {{ .mountPath }}
            {{- end }}
          {{- with $component.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { name: tcp, containerPort: {{ $component.port }} }
          {{- range $extra := $component.extraPorts }}
            - { name: {{ $extra.name }}, containerPort: {{ $extra.port }} }
          {{- end }}
          {{- with $component.env }}
          env:
          {{- range $key, $value := . }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
          {{- end }}
          {{- end }}
          {{- with $component.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 768Mi } }
          {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  type: {{ if and $operatorNodePorts.enabled (has $name (list "redis" "kafka" "milvus")) }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app: {{ $name }} }
  ports:
    - name: tcp
      port: {{ $component.port }}
      targetPort: tcp
      {{- if and $operatorNodePorts.enabled (has $name (list "redis" "kafka" "milvus")) }}
      nodePort: {{ index $operatorNodePorts $name }}
      {{- end }}
  {{- range $extra := $component.extraPorts }}
    - { name: {{ $extra.name }}, port: {{ $extra.port }}, targetPort: {{ $extra.name }} }
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: attu }
spec:
  replicas: 1
  selector: { matchLabels: { app: attu } }
  template:
    metadata: { labels: { app: attu } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
        # Attu writes its generated browser configuration during startup.
        - name: attu-build
          emptyDir: {}
      containers:
        - name: attu
          # Attu v2 remains compatible with the lab's Milvus 2.5 server.
          image: zilliz/attu:v2.5.12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            - name: attu-build
              mountPath: /app/build
          env: [{ name: MILVUS_URL, value: milvus:19530 }]
          ports: [{ name: http, containerPort: 3000 }]
          resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { cpu: 200m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: attu }
spec:
  type: {{ if $operatorNodePorts.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app: attu }
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if $operatorNodePorts.enabled }}
      nodePort: {{ $operatorNodePorts.attuUI }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      automountServiceAccountToken: false
      # jaegertracing/all-in-one uses uid 10001; it needs no writable host
      # path in the lab's in-memory-storage mode.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.68.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 384Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger }
spec:
  type: {{ if $operatorNodePorts.enabled }}NodePort{{ else }}ClusterIP{{ end }}
  selector: { app: jaeger }
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      {{- if $operatorNodePorts.enabled }}
      nodePort: {{ $operatorNodePorts.jaegerUI }}
      {{- end }}
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kibana }
spec:
  replicas: 1
  selector: { matchLabels: { app: kibana } }
  template:
    metadata: { labels: { app: kibana } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
        - name: kibana-data
          emptyDir: {}
        # Kibana 6 creates a Babel cache under optimize on first boot.
        - name: kibana-optimize
          emptyDir: {}
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana-oss:6.2.4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            - name: kibana-data
              mountPath: /usr/share/kibana/data
            - name: kibana-optimize
              mountPath: /usr/share/kibana/optimize
          env: [{ name: ELASTICSEARCH_URL, value: http://product-db:9200 }]
          ports: [{ name: http, containerPort: 5601 }]
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 384Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kibana }
spec:
  type: {{ $dashType }}
  selector: { app: kibana }
  ports: [{ name: http, port: 5601, targetPort: http{{ if .Values.infrastructure.dashboards.nodePort }}, nodePort: {{ .Values.infrastructure.dashboards.kibana }}{{ end }} }]
{{ if .Values.infrastructure.dashboards.kafkaUIEnabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka-ui }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata: { labels: { app: kafka-ui } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
          env:
            - { name: DYNAMIC_CONFIG_ENABLED, value: "false" }
            - { name: KAFKA_CLUSTERS_0_NAME, value: goshopx-lab }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: kafka:9092 }
            - { name: KAFKA_CLUSTERS_0_READONLY, value: "true" }
            # Kafka UI is a JVM process. Cap its heap explicitly so native
            # memory and Netty buffers remain within the container limit.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=50.0" }
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 25m, memory: 128Mi }, limits: { cpu: 250m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka-ui }
spec:
  type: {{ $dashType }}
  selector: { app: kafka-ui }
  ports: [{ name: http, port: 8080, targetPort: http{{ if .Values.infrastructure.dashboards.nodePort }}, nodePort: {{ .Values.infrastructure.dashboards.kafkaUI }}{{ end }} }]
{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redisinsight }
spec:
  replicas: 1
  selector: { matchLabels: { app: redisinsight } }
  template:
    metadata: { labels: { app: redisinsight } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: runtime
          emptyDir: {}
        - name: redisinsight-data
          emptyDir: {}
      containers:
        - name: redisinsight
          image: redis/redisinsight:2.70.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: runtime
              mountPath: /tmp
            - name: redisinsight-data
              mountPath: /data
          ports: [{ name: http, containerPort: 5540 }]
          resources: { requests: { cpu: 25m, memory: 96Mi }, limits: { cpu: 250m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redisinsight }
spec:
  type: {{ $dashType }}
  selector: { app: redisinsight }
  ports: [{ name: http, port: 5540, targetPort: http{{ if .Values.infrastructure.dashboards.nodePort }}, nodePort: {{ .Values.infrastructure.dashboards.redisInsight }}{{ end }} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio-console }
spec:
  type: {{ $dashType }}
  selector: { app: minio }
  ports: [{ name: http, port: 9001, targetPort: 9001{{ if .Values.infrastructure.dashboards.nodePort }}, nodePort: {{ .Values.infrastructure.dashboards.minioConsole }}{{ end }} }]
{{- end }}
