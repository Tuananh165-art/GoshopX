{{- if and .Values.global.ingress.enabled .Values.global.ingress.host }}
# Traefik is K3s's ingress controller only. It forwards every public request to
# Kong; Kong retains the gateway policy and routes declared in its DB-less file.
{{- if eq .Values.global.ingress.className "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: goshopx-force-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goshopx-kong
  {{- if eq .Values.global.ingress.className "traefik" }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace "goshopx-force-https" | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.global.ingress.host | quote }}]
      secretName: {{ .Values.global.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port: { number: 8000 }
{{- end }}
