global:
  # Replace in the bootstrap command or use the GHCR_OWNER repository variable.
  imageRegistry: ghcr.io/replace-owner
  runtimeSecretName: goshopx-runtime
  ingress:
    enabled: false
    className: traefik
    host: ""
  kong:
    # Keep proxy/Admin/Manager ClusterIP by default. Use Traefik ingress for the
    # proxy; expose management UIs via port-forward until firewall allowlists
    # and HTTPS/operator auth are in place.
    proxyNodePort: { enabled: false, port: 30080 }
    managementNodePorts: { enabled: false, admin: 30081, manager: 30082 }
    # Kong is the public edge. Keep its memory bounded without allowing the
    # cache and worker defaults to exhaust the small lab node.
    nginxWorkerProcesses: "1"
    memCacheSize: 64m
    resources: { requests: { cpu: 75m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }

# This value is updated by .github/workflows/release-gitops.yml after an image
# is published. Use a commit SHA only; never deploy mutable `latest` in GitOps.
image:
  tag: 7a88f8ebfac59b0ef1067b558dc9afbf1c20487b

services:
  # Phase 0 keeps core commerce enabled. Phase 3 can enable every service only
  # after Kafka, Milvus and recommender DB capacity have been measured.
  admin: { enabled: true }
  # The server provides the customer chatbot; sync performs the initial
  # catalog import from Product and keeps the recommender projection current.
  recommender-server: { enabled: true }
  recommender-sync: { enabled: true, probesEnabled: false }
  recommender-train: { enabled: false }

config:
  # Seed a bounded public catalog once whenever Product starts in the lab.
  # This supplies visible products, categories, and remote image URLs without
  # enabling the heavier recommender workload.
  DUMMYJSON_SEED_ENABLED: "true"
  DUMMYJSON_SEED_LIMIT: "100"
  # DummyJSON prices are USD. GoshopX stores and displays product prices in VND.
  DUMMYJSON_PRICE_VND_RATE: "25000"
  PRODUCT_API: http://product:8081/products
