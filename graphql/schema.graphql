scalar Time

type Account {
    id: Int!
    name: String!
    email: String!
    orders: [Order!]!
}

type InventoryAvailability {
    productId: String!
    totalQuantity: Int!
    reservedQuantity: Int!
    availableQuantity: Int!
    reorderLevel: Int!
    lowStock: Boolean!
}

type Product {
    id: String!
    name: String!
    description: String!
    price: Float!
    accountId: Int!
    availability: InventoryAvailability
}

type CartItem {
    product: Product!
    quantity: Int!
    reservationId: String!
    reservedUntil: Time!
}

type Cart {
    accountId: Int!
    expiresAt: Time!
    items: [CartItem!]!
}

type Notification {
    id: Int!
    eventType: String!
    title: String!
    message: String!
    metadataJson: String!
    isRead: Boolean!
    createdAt: Time!
    readAt: Time
}

type Order {
    id: Int!
    createdAt: Time!
    totalPrice: Float!
    products: [OrderedProduct!]!
}

type OrderedProduct {
    id: String!
    name: String!
    description: String!
    price: Float!
    quantity: Int!
}

type AuthResponse {
    token: String!
}

type RedirectResponse {
    url: String!
}

input PaginationInput {
    skip: Int!
    take: Int!
}

input RegisterInput {
    name: String!
    email: String!
    password: String!
}

input LoginInput {
    email: String!
    password: String!
}

input CreateProductInput {
    name: String!
    description: String!
    price: Float!
}

input UpdateProductInput {
    id: String!
    name: String!
    description: String!
    price: Float!
}

input OrderedProductInput {
    id: String!
    quantity: Int!
}

input OrderInput {
    products: [OrderedProductInput]!
}

input CustomerPortalSessionInput {
    accountId: Int!
    email: String!
    name: String!
}

input CheckoutProductInput {
    id: String!
    quantity: Int!
}

input CheckoutInput {
    accountId: Int!
    email: String!
    name: String!
    redirectUrl: String!
    products: [CheckoutProductInput]!
    orderId: Int!
}

input UpsertProductStockInput {
    productId: String!
    quantity: Int!
    reorderLevel: Int!
}

type Mutation {
    register(account: RegisterInput!): AuthResponse
    login(account: LoginInput!): AuthResponse
    createProduct(product: CreateProductInput!): Product
    updateProduct(product: UpdateProductInput!): Product
    deleteProduct(id: String!): Boolean
    createOrder(order: OrderInput!): Order
    createCustomerPortalSession(credentials: CustomerPortalSessionInput): RedirectResponse
    createCheckoutSession(details: CheckoutInput): RedirectResponse
    upsertProductStock(input: UpsertProductStockInput!): InventoryAvailability!
    addCartItem(productId: String!, quantity: Int!): Cart!
    updateCartItemQuantity(productId: String!, quantity: Int!): Cart!
    removeCartItem(productId: String!): Cart!
    clearCart: Boolean!
    checkoutCart(redirectUrl: String!): RedirectResponse!
    markNotificationRead(id: Int!): Boolean!
    markAllNotificationsRead: Int!
}

type Query{
    accounts(pagination: PaginationInput, id: Int): [Account!]!
    product(pagination: PaginationInput, query: String, id: String, viewedProductsIds: [String], byAccountId: Boolean): [Product!]!
    myCart: Cart!
    notifications(pagination: PaginationInput): [Notification!]!
    unreadNotificationCount: Int!
}
