global:
  name: consul
  datacenter: lab-k3s
  tls:
    enabled: false
server:
  replicas: 1
  bootstrapExpect: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  storage: 2Gi
ui:
  enabled: true
  service:
    type: NodePort
    # The Consul Helm chart exposes separate node-port fields for HTTP/HTTPS.
    # TLS is disabled for this lab, so only expose the HTTP UI port.
    nodePort:
      http: 30700
      https: null
client:
  enabled: false
syncCatalog:
  enabled: true
  toConsul: true
  toK8S: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 150m, memory: 128Mi }
connectInject:
  enabled: false
controller:
  enabled: false
