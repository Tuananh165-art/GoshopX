apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goshopx-gcp-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tuananh165-art/GoshopX.git
    targetRevision: main
    path: deploy/helm/goshopx
    helm:
      valueFiles:
        - values.yaml
        - values-gcp-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: goshopx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
