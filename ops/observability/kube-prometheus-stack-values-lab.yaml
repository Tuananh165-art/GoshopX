defaultRules:
  create: true
alertmanager:
  enabled: false
grafana:
  adminPassword: CHANGE_ME_VIA_HELM_SET_OR_EXISTING_SECRET
  persistence:
    enabled: true
    size: 2Gi
  resources:
    # Grafana 13 provisions dashboards and plugins during startup. The
    # previous 250m/256Mi limit caused /api/health to time out and removed the
    # pod from its NodePort Service.
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 12
  livenessProbe:
    initialDelaySeconds: 90
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 6
  service:
    type: NodePort
    nodePort: 30702
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.logging.svc.cluster.local
      isDefault: false
prometheus:
  service:
    type: NodePort
    nodePort: 30701
  prometheusSpec:
    retention: 3d
    retentionSize: 3GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests: { cpu: 150m, memory: 512Mi }
      limits: { cpu: 750m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
kubeControllerManager: { enabled: false }
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
