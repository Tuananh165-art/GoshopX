name: CI quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Verify Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.gocache/*' -not -path './.gomodcache/*'))"

      - name: Run unit tests
        env:
          CGO_ENABLED: "1"
        run: |
          packages=$(go list ./... | grep -v '/tests/e2e$')
          go test -race -count=1 $packages

  helm-render:
    name: Helm render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/goshopx -f deploy/helm/goshopx/values-lab.yaml
          helm template goshopx deploy/helm/goshopx -f deploy/helm/goshopx/values-lab.yaml > /tmp/goshopx.yaml

  security:
    name: Secret and configuration scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan pushed commits for verified secrets
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
      - name: Scan pull request changes for verified secrets
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified
      - name: Scan repository for verified secrets
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.88.5
        with:
          path: ./
          extra_args: --only-verified
      - uses: azure/setup-helm@v4
      - name: Render Helm manifests for configuration scanning
        run: >-
          helm template goshopx deploy/helm/goshopx
          -f deploy/helm/goshopx/values-lab.yaml
          > /tmp/goshopx-rendered.yaml
      - name: Create configuration scan SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/goshopx-rendered.yaml
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-config.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
      - name: Fail on high or critical configuration findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/goshopx-rendered.yaml
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
