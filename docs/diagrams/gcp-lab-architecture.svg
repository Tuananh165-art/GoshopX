<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">GoshopX GCP lab architecture</title><desc id="desc">Cloudflare DNS routes users to a GCP HTTPS load balancer and Kong on GKE. GitHub Actions publishes images to Artifact Registry, Argo CD deploys them. Workloads connect to Cloud SQL, Secret Manager, storage, external AI and observability.</desc>
<style>
:root{--red:#d10024;--ink:#15161d;--muted:#5f6472;--canvas:#f7f7f7;--white:#fff;--line:#c9ccd4;--blue:#4285f4;--green:#34a853;--yellow:#fbbc04;--radius:16px}
*{box-sizing:border-box}body{margin:0;padding:28px;background:#eceef2;color:var(--ink);font-family:Montserrat,Arial,sans-serif}.frame{width:min(1600px,100%);margin:auto;background:var(--canvas);padding:34px;border:1px solid #d9dbe1;border-radius:20px}h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--red);text-transform:uppercase}p{color:var(--muted);margin:0 0 20px;font-size:14px}svg{width:100%;height:auto;display:block}.node{fill:#fff;stroke:#d7d9e0;stroke-width:1.5;rx:14}.cloud{fill:#f1f6ff;stroke:#9dbbf2}.gcp{fill:#fff;stroke:#d7d9e0}.focus{fill:#fff3f4;stroke:var(--red);stroke-width:2}.store{fill:#f4f7f4;stroke:#95c69e}.edge{fill:none;stroke:#6d7380;stroke-width:2;marker-end:url(#arrow)}.edge-dash{fill:none;stroke:#8a91a0;stroke-width:1.7;stroke-dasharray:7 6;marker-end:url(#arrow)}.title{font-size:17px;font-weight:700;fill:var(--ink)}.sub{font-size:12px;fill:var(--muted)}.pill{font-size:10px;font-weight:700;fill:#fff}.gcpmark{font-size:11px;font-weight:700;fill:#4285f4}.legend{font-size:11px;fill:var(--muted)}
</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d7380"/></marker></defs>
<!-- request path -->
<rect class="node" x="35" y="100" width="180" height="96"/><text class="title" x="58" y="140">Khách hàng</text><text class="sub" x="58" y="164">Web / mobile</text>
<rect class="node" x="280" y="100" width="190" height="96"/><text class="title" x="304" y="140">Cloudflare DNS</text><text class="sub" x="304" y="164">DNS-only cutover</text>
<rect class="gcp" x="535" y="100" width="220" height="96"/><circle cx="564" cy="127" r="10" fill="#4285f4"/><circle cx="582" cy="127" r="10" fill="#34a853"/><circle cx="600" cy="127" r="10" fill="#fbbc04"/><circle cx="618" cy="127" r="10" fill="#ea4335"/><text class="title" x="555" y="165">HTTPS Load Balancer</text><text class="sub" x="555" y="184">static IP · managed TLS</text>
<path class="edge" d="M215 148H274"/><path class="edge" d="M470 148H529"/>
<!-- GKE boundary -->
<rect class="cloud" x="815" y="55" width="640" height="440" rx="22"/><text class="gcpmark" x="842" y="87">GOOGLE CLOUD · asia-southeast1 · PRIVATE GKE STANDARD</text>
<rect class="focus" x="850" y="120" width="180" height="92"/><text class="title" x="881" y="158">Kong Gateway</text><text class="sub" x="881" y="182">public API edge</text>
<rect class="node" x="1105" y="105" width="300" height="120"/><text class="title" x="1130" y="143">Go microservices</text><text class="sub" x="1130" y="168">GraphQL · gRPC · commerce</text><text class="sub" x="1130" y="190">Account · Product · Order · Stock</text>
<rect class="node" x="850" y="280" width="245" height="115"/><text class="title" x="878" y="320">Recommender</text><text class="sub" x="878" y="344">LangGraph · hybrid RAG</text><text class="sub" x="878" y="366">Discovery · compare · image</text>
<rect class="store" x="1160" y="265" width="245" height="130"/><text class="title" x="1188" y="304">Kafka · Redis · Milvus</text><text class="sub" x="1188" y="329">PVC-backed single replicas</text><text class="sub" x="1188" y="352">lab only · not HA</text><text class="sub" x="1188" y="374">Milvus + etcd + MinIO</text>
<rect class="node" x="850" y="425" width="555" height="45"/><text class="sub" x="875" y="453">Argo CD · Prometheus/Grafana · Alloy/Loki · OpenTelemetry/Jaeger</text>
<path class="edge" d="M755 148H844"/><path class="edge" d="M1030 166H1098"/><path class="edge" d="M1220 225V258"/><path class="edge" d="M1105 167C1050 210 1030 246 1000 275"/><path class="edge-dash" d="M1095 338H1153"/>
<!-- managed resources -->
<rect class="gcp" x="535" y="300" width="220" height="102"/><text class="title" x="562" y="340">Cloud SQL</text><text class="sub" x="562" y="365">PostgreSQL · private IP</text><text class="sub" x="562" y="386">domain DB isolation</text>
<rect class="gcp" x="280" y="300" width="190" height="102"/><text class="title" x="308" y="340">Secret Manager</text><text class="sub" x="308" y="365">Workload Identity</text><text class="sub" x="308" y="386">secret sync is a gate</text>
<rect class="gcp" x="35" y="300" width="180" height="102"/><text class="title" x="63" y="340">Artifact Registry</text><text class="sub" x="63" y="365">immutable image digests</text><text class="sub" x="63" y="386">SBOM · scan · provenance</text>
<path class="edge" d="M850 190C790 245 765 322 755 342"/><path class="edge-dash" d="M850 410H470"/>
<!-- delivery + AI -->
<rect class="focus" x="35" y="545" width="260" height="115"/><text class="title" x="63" y="584">GitHub Actions</text><text class="sub" x="63" y="608">PR gates · image scan · SBOM</text><text class="sub" x="63" y="633">OIDC/WIF · digest promotion PR</text>
<rect class="node" x="365" y="545" width="230" height="115"/><text class="title" x="394" y="584">External AI tools</text><text class="sub" x="394" y="608">DeepSeek vision / chat</text><text class="sub" x="394" y="633">Gemini embeddings · Tavily</text>
<rect class="node" x="675" y="545" width="210" height="115"/><text class="title" x="704" y="584">Cloud Storage</text><text class="sub" x="704" y="608">catalog snapshot · logs</text><text class="sub" x="704" y="633">state bucket provision separately</text>
<rect class="node" x="965" y="545" width="245" height="115"/><text class="title" x="993" y="584">Cloud Operations</text><text class="sub" x="993" y="608">Logging · Monitoring · budget</text><text class="sub" x="993" y="633">budget sends alerts, not hard cap</text>
<path class="edge" d="M295 600H358"/><path class="edge" d="M295 530H780V410H850"/><path class="edge-dash" d="M975 545V478"/><path class="edge-dash" d="M785 545C880 505 1000 492 1080 476"/><path class="edge-dash" d="M600 600H667"/>
<text class="legend" x="35" y="735">Solid: request / delivery flow</text><path class="edge" d="M35 765H100"/><text class="legend" x="120" y="769">Dashed: managed service / telemetry link</text><path class="edge-dash" d="M35 790H100"/><text class="legend" x="1240" y="790">Designed for a 48-hour lab · not HA</text>
</svg>